<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Submission</title>
    <style>
        body {
            background-color: #282828;
            color: #ebdbb2;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #3c3836;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #fabd2f;
        }
        p {
            color: #d5c4a1;
        }
        form {
            margin-top: 20px;
        }
        form label {
            display: block;
            font-size: 1.2em;
            color: #b8bb26;
            margin-bottom: 10px;
        }
        form input[type="file"] {
            margin-bottom: 20px;
        }
        form input[type="submit"] {
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #98971a;
            color: #282828;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        form input[type="submit"]:hover {
            background-color: #79740e;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #83a598;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function validateFileSize(input) {
            const maxSize = 2 * 1024 * 1024; // 2MB in bytes
            const fileSize = input.files[0].size;

            if (fileSize > maxSize) {
                alert('File size exceeds the limit of 2MB. Please choose a smaller file.');
                input.value = ''; // Clear the file input
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Battle Submission</h2>
        {% if current_user.is_authenticated %}
            <p>Select up to three photos to submit for the battle. Each photo must be less than 2MB in size.</p>
            <form action="{{ url_for('submit_battle_route') }}" method="post" enctype="multipart/form-data">
                <label for="photo1">Photo 1:</label>
                <input type="file" name="photo1" id="photo1" accept="image/*" onchange="validateFileSize(this)" required>
                <br>
                <label for="photo2">Photo 2:</label>
                <input type="file" name="photo2" id="photo2" accept="image/*" onchange="validateFileSize(this)">
                <br>
                <label for="photo3">Photo 3:</label>
                <input type="file" name="photo3" id="photo3" accept="image/*" onchange="validateFileSize(this)">
                <br>
                <input type="submit" value="Submit">
            </form>
        {% else %}
            <p>You must be logged in to submit photos for the battle.</p>
            <div class="login-link">
                Please <a href="{{ url_for('login') }}">log in</a> or <a href="{{ url_for('register') }}">register</a> to participate.
            </div>
        {% endif %}
    </div>
</body>
</html>
