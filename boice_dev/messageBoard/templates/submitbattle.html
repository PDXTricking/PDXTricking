<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo</title>
</head>
<body>
    <h1>Upload your photo and submit your name</h1>
    <form method="POST" action="/uploadbattle" enctype="multipart/form-data">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required>
        <br><br>
        <label for="battle number">Battle Number:</label>
        <input type="number" name="battle" id="battle" min="1" max="20" required>
        <br><br>
        <label for="file">Photo:</label>
        <input type="file" name="file" id="file" required>
        <br><br>
        <button type="submit">Submit</button>
    </form>

    <h2>Uploaded Photos</h2>
    {% for user in users %}
        <div>
            <p>{{ user.name }}</p>
            <img src="{{ url_for('static', filename='uploads/' + user.photo_filename) }}" alt="{{ user.name }}" width="200">
            <p>Votes: {{ user.votes }}</p>
            <form method="POST" action="{{ url_for('vote', user_id=user.id) }}">
                <button type="submit">Vote</button>
            </form>
        </div>
        <br>
    {% endfor %}
</body>
</html>
