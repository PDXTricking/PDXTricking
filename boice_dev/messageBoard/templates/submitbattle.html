<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo</title>
    <style>
        /* Gruvbox Colors */
        :root {
            --bg-dark: #282828;
            --bg-light: #3c3836;
            --fg-light: #ebdbb2;
            --fg-dark: #d5c4a1;
            --accent: #fabd2f;
            --highlight: #fe8019;
            --border-color: #504945;
        }
        
        body {
            background-color: var(--bg-dark);
            color: var(--fg-light);
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1, h2 {
            color: var(--accent);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 5px var(--highlight);
        }

        h2 {
            font-size: 2em;
            margin-top: 40px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        form {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        label {
            font-size: 1.2em;
            color: var(--fg-light);
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="number"], input[type="file"] {
            background-color: var(--bg-dark);
            color: var(--fg-light);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px;
            width: calc(100% - 22px); /* Full width minus padding and border */
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--highlight);
            color: var(--bg-dark);
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--accent);
        }

        .uploaded-photos {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .uploaded-photos div {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
        }

        .uploaded-photos img {
            border-radius: 8px;
            border: 3px solid var(--highlight);
            width: 100%;
            height: auto;
            max-height: 400px; /* Adjust the height as needed */
            object-fit: contain; /* Ensures the whole image is visible */
        }
    </style>
</head>
<body>
    <h1>Upload Your Photo and Submit Your Name</h1>
    
    <form method="POST" action="/uploadbattle" enctype="multipart/form-data">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required>
        <br>
        <label for="battle">Battle Number:</label>
        <input type="number" name="battle" id="battle" min="1" max="20" required>
        <br>
        <label for="file">Photo:</label>
        <input type="file" name="file" id="file" required>
        <br>
        <button type="submit">Submit</button>
    </form>

    <h2>Uploaded Photos</h2>
    <div class="uploaded-photos">
        {% for user in users %}
            <div>
                <p>{{ user.name }}</p>
                <img src="{{ url_for('static', filename='uploads/' + user.photo_filename) }}" alt="{{ user.name }}">
            </div>
        {% endfor %}
    </div>
</body>
</html>
