<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new password</title>
    <style>
        body { background-color: #282828; color: #ebdbb2; font-family: Arial, sans-serif; }
        .container { width: 320px; margin: 40px auto; padding: 20px; background: #3c3836; border-radius: 6px; }
        input, button { width: 100%; padding: 10px; margin-top: 8px; }
        button { background: #98971a; color: #ebdbb2; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Set a new password</h2>
        <form method="post">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Set password</button>
        </form>
    </div>
</body>
</html>
